[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_speed"]

[project]
name = "vehicle-speed-estimation"
version = "0.1.0"
description = "Monocular camera vehicle speed estimation with ESP32 ground-truth telemetry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Kadir Yıldız" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "pyserial>=3.5",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.0",
]
dev = [
    "ruff==0.16.7",
    "mypy==1.11.2",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "coverage[toml]>=7.4",
]

[project.scripts]
vehicle-speed = "vehicle_speed.cli:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ============================================================================
# Kod Kalitesi: Ruff Linter & Formatter
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["archive", "firmware/.pio", "docs", "eski"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "S",    # flake8-bandit
    "RUF",  # ruff-specific rules
]
ignore = [
    "B008",   # Do not perform function call in argument defaults (needed for CLI)
    "S101",   # Use of assert detected (configured in per-file-ignores for tests)
    "RUF001", # Ambiguous unicode character in string (Turkish characters: ı, İ, ş, ğ, etc.)
    "RUF002", # Ambiguous unicode character in docstring
    "RUF003", # Ambiguous unicode character in comment
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001", "ARG002", "N802"]
"scripts/**/*.py" = ["S101"]
"src/vehicle_speed/cli.py" = ["B008"]
"src/vehicle_speed/filters/**/*.py" = ["N806"]

[tool.ruff.lint.isort]
known-first-party = ["vehicle_speed"]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ============================================================================
# Statik Tip Denetimi: Mypy Strict
# ============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
show_error_codes = true
pretty = true
files = ["src", "tests"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
enable_error_code = ["possibly-undefined", "ignore-without-code", "redundant-expr"]

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "ultralytics.*",
    "scipy.*",
    "torch.*",
    "serial.*",
]
ignore_missing_imports = true

# ============================================================================
# Test Mimarisi: Pytest & Coverage
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "hardware: tests requiring physical hardware connected",
]

[tool.coverage.run]
source = ["src/vehicle_speed"]
omit = [
    "src/vehicle_speed/visualization.py",  # GUI excluded from headless coverage
    "src/vehicle_speed/cli.py",            # Interactive CLI entry point
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
